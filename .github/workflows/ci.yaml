name: Linter & Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Run Tests (Node ${{ matrix.node-version }}, ESLint ${{ matrix.eslint-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
        eslint-version: ["10.4.0", "10"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Select ESLint Version
        run: npm install --ignore-scripts --no-save --package-lock=false eslint@${{ matrix.eslint-version }}

      - name: Verify ESLint Version
        env:
          ESLINT_SPEC: ${{ matrix.eslint-version }}
        run: |
          node -e "const version = require('eslint/package.json').version; console.log('Selected ESLint ' + version); if (version.split('.')[0] !== '10' || (process.env.ESLINT_SPEC === '10.4.0' && version !== '10.4.0')) { console.error('Installed ESLint does not satisfy ' + process.env.ESLINT_SPEC); process.exit(1); }"

      - name: Build Package
        run: npm run build

      - name: Verify TypeScript Toolchains
        run: |
          node -e "const fs = require('node:fs'); const ts = require('typescript'); const compat = JSON.parse(fs.readFileSync('node_modules/typescript/package.json', 'utf8')); const native = JSON.parse(fs.readFileSync('node_modules/@typescript/native/package.json', 'utf8')); console.log('Lint API: ' + compat.name + '@' + ts.version + '; compiler: ' + native.name + '@' + native.version); if (compat.name !== '@typescript/typescript6' || native.name !== 'typescript' || !ts.version.startsWith('6.') || !native.version.startsWith('7.') || !compat.bin.tsc6 || compat.bin.tsc) process.exit(1);"
          ts7_version="$(npm exec --no --ignore-scripts -- tsc --version)"
          ts6_version="$(npm exec --no --ignore-scripts -- tsc6 --version)"
          echo "tsc: $ts7_version; tsc6: $ts6_version"
          [[ "$ts7_version" == "Version 7."* ]]
          [[ "$ts6_version" == "Version 6."* ]]

      - name: Typecheck
        run: npm run check

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Test Packed Consumer
        run: npm run test:consumer -- --eslint-version=${{ matrix.eslint-version }} --typescript-mode=typescript6

      - name: Test Packed Consumer with TypeScript 7 Compilation
        run: npm run test:consumer -- --eslint-version=${{ matrix.eslint-version }} --typescript-mode=side-by-side

  lint-test-required:
    name: Lint & Run Tests
    needs: lint-test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the matrix passed
        run: |
          if [ "${{ needs.lint-test.result }}" != "success" ]; then
            echo "One or more Lint & Run Tests matrix jobs failed (result: ${{ needs.lint-test.result }})."
            exit 1
          fi
